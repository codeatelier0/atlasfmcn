<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMCN — Impacto territorial 2025 · Inversión (privado)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --verde:#0F6E56; --azul:#185FA5; --oliva:#a7a337;
    --texto:#111827; --texto-sec:#6B7280;
    --fondo:#F9FAFB; --blanco:#FFFFFF; --borde:#E5E7EB;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Open Sans',sans-serif; font-size:14px; color:var(--texto);
    background:var(--fondo); display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  h1,h2,h3,button{ font-family:'Lato',sans-serif; }

  /* ============ HEADER ============ */
  header{
    background:var(--blanco); border-bottom:1px solid var(--borde);
    display:flex; align-items:center; gap:16px; padding:10px 20px; flex:0 0 auto;
  }
  .logo-fmcn{
    width:40px; height:40px; background:var(--verde); color:#fff; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Lato',sans-serif; font-weight:700; font-size:11px; letter-spacing:.5px; flex:0 0 auto;
  }
  .titulo-bloque{ text-align:center; display:flex; align-items:center; gap:12px; }
  .titulo-textos h1{ font-size:18px; font-weight:600; line-height:1.2; }
  .titulo-textos p{ font-size:12px; color:var(--texto-sec); }
  .lang-toggle{
    display:flex; border:1px solid var(--borde); border-radius:20px; overflow:hidden; flex:0 0 auto;
  }
  .lang-toggle button{
    border:none; background:transparent; padding:4px 10px; font-size:12px; font-weight:700;
    color:var(--texto-sec); cursor:pointer; transition:background .2s ease,color .2s ease;
  }
  .lang-toggle button[aria-pressed="true"]{ background:var(--azul); color:#fff; }
  .filtros{ margin-left:auto; display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
  .pill{
    display:flex; align-items:center; gap:6px;
    border:1px solid #D1D5DB; background:var(--blanco); color:var(--texto-sec);
    border-radius:20px; padding:6px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
    transition:all .2s ease;
  }
  .pill:hover{ border-color:var(--verde); color:var(--verde); }
  .pill[aria-pressed="true"]{ background:var(--verde); border-color:var(--verde); color:#fff; }
  .pill .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .pill[aria-pressed="true"] .dot{ outline:1.5px solid rgba(255,255,255,.8); }

  /* ============ LAYOUT ============ */
  main{ flex:1 1 auto; display:flex; min-height:0; }
  #map{ flex:0 0 65%; min-width:0; background:#EDEFF1; }
  aside{
    flex:0 0 35%; min-width:0; background:var(--blanco); border-left:1px solid var(--borde);
    overflow-y:auto; padding:24px;
  }

  /* ============ MAPA ============ */
  .fmcn-marker{ background:transparent; border:none; }
  .fmcn-dot{
    width:100%; height:100%; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.9);
    box-shadow:0 0 0 1px rgba(0,0,0,.12);
    transition:transform .2s ease, opacity .2s ease;
    position:relative;
  }
  .leaflet-marker-icon{ transition:opacity .2s ease; }
  .leaflet-marker-icon.atenuado{ opacity:.15; }
  .leaflet-marker-icon.resaltado .fmcn-dot{ transform:scale(1.18); }
  .leaflet-marker-icon:hover .fmcn-dot, .leaflet-marker-icon:focus .fmcn-dot{ transform:scale(1.18); }
  .fmcn-dot.seleccionado::after{
    content:""; position:absolute; inset:-7px; border-radius:50%;
    border:2px solid currentColor;
    animation:pulso 1.6s ease-out infinite;
  }
  @keyframes pulso{
    0%{ transform:scale(.8); opacity:.9; }
    70%{ transform:scale(1.25); opacity:0; }
    100%{ transform:scale(1.25); opacity:0; }
  }
  .leaflet-tooltip.fmcn-tooltip{
    font-family:'Open Sans',sans-serif; font-size:12.5px; color:var(--texto);
    border:1px solid var(--borde); border-radius:8px; box-shadow:none; padding:7px 11px;
  }
  .fmcn-tooltip strong{ font-family:'Lato',sans-serif; font-size:13px; display:block; }
  .fmcn-tooltip span{ color:var(--texto-sec); font-size:12px; }
  .region-label{
    font-family:'Open Sans',sans-serif; font-size:11px; color:#9CA3AF;
    letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; text-align:center;
    pointer-events:none;
  }
  .ctrl-regiones{
    background:var(--blanco); border:1px solid #D1D5DB; border-radius:8px;
    padding:6px 12px; font-family:'Lato',sans-serif; font-size:12px; font-weight:600;
    color:var(--texto-sec); cursor:pointer; transition:all .2s ease;
  }
  .ctrl-regiones[aria-pressed="true"]{ background:var(--azul); border-color:var(--azul); color:#fff; }

  /* ============ PANEL ============ */
  .panel-card{ display:flex; flex-direction:column; gap:18px; }
  .panel-intro h2{ font-size:24px; font-weight:700; line-height:1.25; margin-bottom:10px; }
  .panel-intro p{ font-size:14px; line-height:1.6; color:var(--texto-sec); }
  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi{
    background:var(--fondo); border:1px solid var(--borde); border-radius:8px; padding:14px 16px;
  }
  .kpi .valor{ font-family:'Lato',sans-serif; font-size:22px; font-weight:700; line-height:1.1; }
  .kpi .etiqueta{ font-size:12px; color:var(--texto-sec); margin-top:4px; }
  .enlace{
    color:var(--azul); font-weight:600; text-decoration:none; font-size:14px;
    transition:color .2s ease;
  }
  .enlace:hover{ text-decoration:underline; }

  .prog-header{ display:flex; flex-direction:column; gap:4px; border-bottom:1px solid var(--borde); padding-bottom:14px; }
  .prog-titulo{ display:flex; align-items:center; gap:10px; }
  .prog-titulo .dot{ width:14px; height:14px; border-radius:50%; flex:0 0 auto; }
  .prog-titulo h2{ font-size:22px; font-weight:700; line-height:1.2; }
  .prog-estados{ font-size:13px; color:var(--texto-sec); }
  .prog-tipo{ font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .prog-desc{ font-size:13px; line-height:1.6; color:var(--texto); }
  .seccion-label{
    font-family:'Lato',sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--texto-sec); margin-bottom:8px;
  }
  .badge-fin{
    display:inline-block; background:var(--oliva); color:#111827;
    border-radius:20px; padding:5px 14px; font-size:12.5px; font-weight:600; line-height:1.4;
  }
  .chart-box{ height:120px; }
  .chart-na{ font-size:12.5px; color:var(--texto-sec); font-style:italic; }
  .btn-ficha{
    width:100%; border:none; background:var(--verde); color:#fff;
    border-radius:8px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer;
    transition:background .2s ease;
  }
  .btn-ficha:hover{ background:#0c5a47; }
  .btn-volver{
    border:none; background:transparent; color:var(--azul); font-size:13px; font-weight:600;
    cursor:pointer; align-self:flex-start; padding:0;
  }
  .btn-volver:hover{ text-decoration:underline; }

  /* ============ FOOTER ============ */
  footer{
    flex:0 0 52px; background:var(--verde); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .stat-global{
    display:flex; align-items:baseline; gap:7px; padding:0 26px;
    border-right:1px solid rgba(255,255,255,.25);
  }
  .stat-global:last-child{ border-right:none; }
  .stat-global .num{ font-family:'Lato',sans-serif; font-size:17px; font-weight:700; }
  .stat-global .lbl{ font-size:12px; opacity:.85; }

  /* ============ RESPONSIVO ============ */
  @media (max-width:768px){
    body{ overflow:auto; height:auto; }
    header{ flex-wrap:wrap; }
    .filtros{ margin-left:0; justify-content:flex-start; width:100%; }
    main{ flex-direction:column; }
    #map{ flex:none; width:100%; height:55vh; }
    aside{ flex:none; width:100%; border-left:none; border-top:1px solid var(--borde); }
    footer{ flex-wrap:wrap; height:auto; min-height:52px; padding:8px 0; gap:6px 0; }
    .stat-global{ padding:0 14px; }
  }

  /* ====== VARIACIÓN PRIVADA — INVERSIÓN ====== */
  .badge-vista{
    background:var(--oliva); color:#111827; font-family:'Lato',sans-serif; font-weight:700;
    font-size:11px; padding:4px 11px; border-radius:20px; white-space:nowrap; flex:0 0 auto;
  }
  .toolbar-privado{
    background:#FAFAF2; border-bottom:1px solid var(--borde); display:flex; align-items:center;
    gap:18px; padding:8px 20px; flex:0 0 auto; flex-wrap:wrap; font-size:13px;
  }
  .tp-lock{ display:flex; align-items:center; gap:6px; font-family:'Lato',sans-serif; font-weight:700; color:#7c7a2c; font-size:12.5px; }
  .toolbar-privado .seg{ display:flex; align-items:center; gap:8px; }
  .toolbar-privado .seg-label{ color:var(--texto-sec); font-size:12px; font-weight:600; }
  .toolbar-privado .seg-btns{ display:flex; border:1px solid var(--borde); border-radius:20px; overflow:hidden; background:#fff; }
  .toolbar-privado .seg button{
    border:none; background:transparent; padding:5px 14px; font-family:'Lato',sans-serif; font-weight:700;
    font-size:12px; color:var(--texto-sec); cursor:pointer; transition:background .2s ease, color .2s ease;
  }
  .toolbar-privado .seg button[aria-pressed="true"]{ background:var(--verde); color:#fff; }
  .tp-nota{ margin-left:auto; color:var(--texto-sec); font-size:11.5px; font-style:italic; }

  .fmcn-dot.hollow{ box-shadow:none; }

  .acceso-badge{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px; font-family:'Open Sans',sans-serif; }
  .acceso-badge.pub{ background:#E7F1EC; color:#0F6E56; }
  .acceso-badge.priv{ background:#F3F1DC; color:#7c7a2c; }
  .inv-grid{ display:flex; flex-direction:column; gap:7px; background:var(--fondo); border:1px solid var(--borde); border-radius:8px; padding:12px 14px; }
  .inv-row{ display:flex; justify-content:space-between; gap:14px; font-size:12.5px; }
  .inv-k{ color:var(--texto-sec); flex:0 0 auto; }
  .inv-v{ font-weight:600; text-align:right; }
  .ha-split{ display:flex; gap:10px; margin-top:8px; }
  .ha-seg{ flex:1; background:var(--fondo); border:1px solid var(--borde); border-radius:8px; padding:10px 12px; }
  .ha-num{ font-family:'Lato',sans-serif; font-weight:700; font-size:16px; display:block; line-height:1.1; }
  .ha-lbl{ font-size:11px; color:var(--texto-sec); }

  .inv-overview .lock{ font-size:12px; }
  .mec-bar{ display:flex; height:14px; border-radius:20px; overflow:hidden; margin:4px 0 10px; border:1px solid var(--borde); }
  .mec-seg{ display:block; }
  .mec-leg{ display:flex; flex-direction:column; gap:5px; }
  .mec-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .mec-name{ flex:1; color:var(--texto); }
  .mec-n{ font-family:'Lato',sans-serif; font-weight:700; color:var(--texto-sec); }
  .inv-nota{ font-size:11.5px; color:var(--texto-sec); font-style:italic; margin-top:8px; line-height:1.5; }
  .lg-dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; display:inline-block; }

  .fmcn-legend{ background:#fff; border:1px solid var(--borde); border-radius:8px; padding:10px 12px; font-size:12px; line-height:1.55; box-shadow:0 1px 2px rgba(0,0,0,.06); max-width:240px; }
  .fmcn-legend .lg-title{ font-family:'Lato',sans-serif; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--texto-sec); margin-bottom:6px; }
  .fmcn-legend .lg-row{ display:flex; align-items:center; gap:7px; }
  .fmcn-legend .lg-dot.hollow{ background:transparent; border:2px dashed #9CA3AF; }
  .fmcn-legend .lg-count{ margin-top:7px; padding-top:7px; border-top:1px solid var(--borde); font-weight:600; color:var(--texto); }
</style>
</head>
<body>

<!-- ============ COMPONENTE 1: HEADER ============ -->
<header data-screen-label="Header">

    </div>
    <span class="badge-vista" data-i18n="vista">Vista: Privada</span>
  </div>
  <nav class="filtros" id="filtros" aria-label="Filtros por tipo de intervención"></nav>

      <button type="button" data-color="tipo" aria-pressed="true" data-i18n="color_tipo">Tipo</button>
      <button type="button" data-color="donante" aria-pressed="false" data-i18n="color_donante">Donante</button>
    </div>
  </div>
  <span class="tp-nota" data-i18n="tp_nota">Montos no desagregados provienen de sistemas internos (LOVIS/SISEP).</span>
</div>

<main>

  <aside id="panel" data-screen-label="Panel lateral" aria-live="polite" tabindex="-1"></aside>
</main>

function usd0(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
function montoRadio(m){ return Math.max(12, Math.min(26, Math.round(Math.sqrt(m / 1e6) * 4.6))); }
function estiloMarcador(p){
  const color = (colorMode === "donante") ? DONANTE_CAT[p.donante_cat].color : p.color;
  let radius, hollow = false;
  if (escalaMode === "inversion"){
    if (p.monto_usd){ radius = montoRadio(p.monto_usd); }
    else { radius = 8; hollow = true; }
  } else {
    radius = radioPorHa(p.ha);
  }
  return { radius, color, hollow };
}
function iconoPrograma(p){
  const s = estiloMarcador(p);
  const d = s.radius * 2;
  const fill = s.hollow ? "transparent" : s.color;
  const extra = s.hollow ? ("border:2px dashed " + s.color + ";") : "";
  return L.divIcon({
    className: "fmcn-marker",
    html: '<div class="fmcn-dot' + (s.hollow ? " hollow" : "") + '" style="background:' + fill + '; color:' + s.color + ';' + extra + '"></div>',
    iconSize: [d, d],
    iconAnchor: [s.radius, s.radius]
  });
}

let anpVisible = false;
const CtrlANP = L.Control.extend({
  options: { position: "topright" },
  onAdd: function(){
    const btn = L.DomUtil.create("button", "ctrl-regiones");
    btn.id = "btn-anp";
    btn.type = "button";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", "Mostrar polígonos de ANP federales (SIG CONANP, simplificado)");
    btn.title = "Polígonos simplificados — SIG CONANP";
    btn.textContent = t("anp_layer");
    L.DomEvent.disableClickPropagation(btn);
    btn.addEventListener("click", () => {
      anpVisible = !anpVisible;
      btn.setAttribute("aria-pressed", String(anpVisible));
      if (anpVisible) capaANP.addTo(map); else map.removeLayer(capaANP);
    });
    return btn;
  }
});
map.addControl(new CtrlANP());

/* =====================================================
   FILTROS (pills del header)
   ===================================================== */
function renderFiltros(){
  const cont = document.getElementById("filtros");
  cont.innerHTML = "";
  const opciones = [{ key: "todos", color: null }].concat(TIPOS);
  opciones.forEach(op => {
    const btn = document.createElement("button");
    btn.className = "pill";
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(filtroActivo === op.key));
    btn.setAttribute("aria-label", "Filtrar: " + t(op.key));
    if (op.color) {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = op.color;
      btn.appendChild(dot);
    }
    btn.appendChild(document.createTextNode(t(op.key)));
    btn.addEventListener("click", () => aplicarFiltro(op.key));
    cont.appendChild(btn);
  });
}

function aplicarFiltro(key){
  filtroActivo = key;
  programaSeleccionado = null;
  renderFiltros();
  actualizarMarcadores();
  renderLegend();
  renderPanelBienvenida();
}

function actualizarMarcadores(){
  programas.forEach(p => {
    const el = marcadores[p.id].getElement();
    if (!el) return;
    const dot = el.querySelector(".fmcn-dot");
    el.classList.toggle("atenuado", filtroActivo !== "todos" && p.tipo_intervencion !== filtroActivo);
    el.classList.toggle("resaltado", filtroActivo !== "todos" && p.tipo_intervencion === filtroActivo);
    dot.classList.toggle("seleccionado", programaSeleccionado === p.id);
  });
}

/* =====================================================
   PANEL LATERAL
   ===================================================== */
const panel = document.getElementById("panel");

      '</div>' +
      '<div class="kpi-grid">' +

        kpiHtml("26", t("kpi_proyectos")) +
        kpiHtml("369", t("kpi_orgs")) +
        kpiHtml("425", t("kpi_especies")) +
      '</div>' +
      '<div class="inv-overview">' +
        '<div class="seccion-label">' + t("inv_cartera") + ' <span class="lock">🔒</span></div>' +
        '<div class="kpi-grid">' +
          kpiHtml("USD 79.5M", t("inv_pub_doc")) +
          kpiHtml("3,189", t("inv_donativos")) +

function kpiHtml(valor, etiqueta){
  return '<div class="kpi"><div class="valor">' + valor + '</div><div class="etiqueta">' + etiqueta + '</div></div>';
}

function seleccionarPrograma(id){
  programaSeleccionado = id;
  actualizarMarcadores();
  renderPanelPrograma(programas.find(p => p.id === id));
}

function renderPanelPrograma(p){
  const desc = (lang === "en" && p.descripcion_en) ? p.descripcion_en : p.descripcion;
  const estados = (lang === "en" && p.estados_en) ? p.estados_en : p.estados;
  panel.innerHTML =
    '<div class="panel-card">' +
      '<button class="btn-volver" type="button" id="btn-volver" aria-label="' + t("volver") + '">' + t("volver") + '</button>' +
      '<div class="prog-header">' +
        '<div class="prog-titulo">' +
          '<span class="dot" style="background:' + p.color + ';"></span>' +
          '<h2>' + p.nombre + '</h2>' +
        '</div>' +
        '<span class="prog-tipo" style="color:' + p.color + ';">' + t(p.tipo_intervencion) + '</span>' +
        '<span class="prog-estados">' + estados + '</span>' +
      '</div>' +
      '<p class="prog-desc">' + desc + '</p>' +
      '<div>' +
        '<div class="seccion-label">KPIs</div>' +
        '<div class="kpi-grid">' +
          kpiHtml(fmtKpi(p.kpis.hectareas), t("f_hectareas")) +
          kpiHtml(fmtKpi(p.kpis.personas), t("f_personas")) +
          kpiHtml(fmtKpi(p.kpis.organizaciones), t("f_orgs")) +
          kpiHtml(fmtKpi(p.kpis.especies), t("f_especies")) +
        '</div>' +
      '</div>' +
      '<div class="inversion-box">' +
        '<div class="seccion-label">' + t("inversion") + accesoBadge(p) + '</div>' +
        '<div class="inv-grid">' +
          invRow(t("inv_donante"), p.donante) +
          invRow(t("inv_monto"), montoTexto(p)) +
          invRow(t("inv_mecanismo"), DONANTE_CAT[p.donante_cat][lang] || p.donante_cat) +
          invRow(t("inv_vigencia"), vigencia(p)) +
        '</div>' +
        haSplitHtml(p) +
      '</div>' +
      '<div>' +
        '<div class="seccion-label">' + t("comparativa") + '</div>' +
        (p.ha > 0
          ? '<div class="chart-box"><canvas id="chart-programa" aria-label="' + t("comparativa") + '"></canvas></div>'
          : '<p class="chart-na">' + t("comparativa_nd") + '</p>') +
      '</div>' +
      '<button class="btn-ficha" type="button" id="btn-ficha" aria-label="' + t("ver_ficha") + ' — ' + p.nombre + '">' + t("ver_ficha") + '</button>' +
    '</div>';

  document.getElementById("btn-volver").addEventListener("click", () => {
    programaSeleccionado = null;
    actualizarMarcadores();
    renderPanelBienvenida();
  });
  document.getElementById("btn-ficha").addEventListener("click", () => {
    console.log("abrir ficha: " + p.id);
  });
  if (p.ha > 0) renderChart(p);
  panel.scrollTop = 0;
}

function fmtKpi(v){
  if (v === "N/D") return "N/D";
  return (typeof v === "number") ? v.toLocaleString("en-US") : v;
}

/* Mini gráfica Chart.js: programa vs promedio del portafolio (escala log) */
function renderChart(p){
  if (chartRef) { chartRef.destroy(); chartRef = null; }
  const conHa = programas.filter(x => x.ha > 0);
  const promedio = Math.round(conHa.reduce((s, x) => s + x.ha, 0) / conHa.length);
  const ctx = document.getElementById("chart-programa").getContext("2d");
  chartRef = new Chart(ctx, {
    type: "bar",
    data: {
      labels: [t("este_programa"), t("promedio")],
      datasets: [{
        data: [p.ha, promedio],
        backgroundColor: [p.color, "#D1D5DB"],
        borderRadius: 4,
        barThickness: 22
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: c => c.parsed.x.toLocaleString("en-US") + " ha" }
        }
      },
      scales: {
        x: {
          type: "logarithmic",
          grid: { color: "#F3F4F6" },
          ticks: {
            color: "#6B7280", font: { family: "'Open Sans'", size: 10 }, maxTicksLimit: 5,
            callback: v => {
              if (v >= 1e6) return (v / 1e6) + "M";
              if (v >= 1e3) return (v / 1e3) + "k";
              return v;
            }
          }
        },
        y: {
          grid: { display: false },
          ticks: { color: "#111827", font: { family: "'Open Sans'", size: 11 } }
        }
      }
    }
  });
}

/* =====================================================
   BARRA DE ESTADÍSTICAS GLOBALES
   ===================================================== */
function renderStats(){
  const f = document.getElementById("stats");
  f.innerHTML = "";
  t("stats").forEach(s => {
    const div = document.createElement("div");
    div.className = "stat-global";
    div.innerHTML = '<span class="num">' + s.num + '</span><span class="lbl">' + s.lbl + '</span>';
    f.appendChild(div);
  });
}

/* =====================================================
   IDIOMA
   ===================================================== */
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById("lang-es").setAttribute("aria-pressed", String(l === "es"));
  document.getElementById("lang-en").setAttribute("aria-pressed", String(l === "en"));
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.getAttribute("data-i18n")); });
  renderFiltros();
  renderStats();
  renderToolbarEstado();
  renderLegend();
  construirRegiones();
  const btnReg = document.getElementById("btn-regiones");
  if (btnReg) btnReg.textContent = t("regiones");
  const btnANP = document.getElementById("btn-anp");
  if (btnANP) btnANP.textContent = t("anp_layer");
  programas.forEach(p => marcadores[p.id].setTooltipContent(tooltipHtml(p)));
  if (programaSeleccionado) {
    renderPanelPrograma(programas.find(p => p.id === programaSeleccionado));
  } else {
    renderPanelBienvenida();
  }
}

/* =====================================================
   INVERSIÓN — helpers de panel, toolbar y leyenda
   ===================================================== */
function montoTexto(p){ return p.monto_usd ? (usd0(p.monto_usd) + " USD") : t("monto_nd"); }
function vigencia(p){ return t("inv_desde") + " " + p.year_inicio + " · " + (p.year_fin ? p.year_fin : t("activo")); }
function accesoBadge(p){
  const pub = p.nivel_acceso_financiero === "publico";
  return ' <span class="acceso-badge ' + (pub ? "pub" : "priv") + '">' + (pub ? t("acc_pub") : "🔒 " + t("acc_priv")) + '</span>';
}
function invRow(k, v){ return '<div class="inv-row"><span class="inv-k">' + k + '</span><span class="inv-v">' + v + '</span></div>'; }
function haSplitHtml(p){
  const prot = p.ha_protegidas || 0, man = p.ha_manejo_sostenible || 0;
  if (!prot && !man) return "";
  return '<div class="ha-split">' +
    '<div class="ha-seg"><span class="ha-num">' + prot.toLocaleString("en-US") + '</span><span class="ha-lbl">' + t("ha_prot") + '</span></div>' +
    '<div class="ha-seg"><span class="ha-num">' + man.toLocaleString("en-US") + '</span><span class="ha-lbl">' + t("ha_man") + '</span></div>' +
  '</div>';
}
function mecanismoLista(){
  const seg = CAT_ORDER.map(c => '<span class="mec-seg" style="flex:' + DONANTE_CAT[c].n + '; background:' + DONANTE_CAT[c].color + ';" title="' + (DONANTE_CAT[c][lang] || c) + ': ' + DONANTE_CAT[c].n + '"></span>').join("");
  const leg = CAT_ORDER.map(c => '<div class="mec-row"><span class="lg-dot" style="background:' + DONANTE_CAT[c].color + ';"></span><span class="mec-name">' + (DONANTE_CAT[c][lang] || c) + '</span><span class="mec-n">' + DONANTE_CAT[c].n + '</span></div>').join("");
  return '<div class="mec-bar">' + seg + '</div><div class="mec-leg">' + leg + '</div>';
}

function wireToolbar(){
  document.querySelectorAll(".toolbar-privado [data-escala]").forEach(b => {
    b.addEventListener("click", () => { escalaMode = b.getAttribute("data-escala"); renderToolbarEstado(); refrescarMarcadores(); renderLegend();
      if (programaSeleccionado) renderPanelPrograma(programas.find(p => p.id === programaSeleccionado)); });
  });
  document.querySelectorAll(".toolbar-privado [data-color]").forEach(b => {
    b.addEventListener("click", () => { colorMode = b.getAttribute("data-color"); renderToolbarEstado(); refrescarMarcadores(); renderLegend(); });
  });
}
function renderToolbarEstado(){
  document.querySelectorAll(".toolbar-privado [data-escala]").forEach(b => b.setAttribute("aria-pressed", String(b.getAttribute("data-escala") === escalaMode)));
  document.querySelectorAll(".toolbar-privado [data-color]").forEach(b => b.setAttribute("aria-pressed", String(b.getAttribute("data-color") === colorMode)));
}

const legendControl = L.control({ position: "bottomleft" });
legendControl.onAdd = function(){ const div = L.DomUtil.create("div", "fmcn-legend"); div.id = "fmcn-legend"; return div; };
legendControl.addTo(map);
function visiblesCount(){ return programas.filter(p => filtroActivo === "todos" || p.tipo_intervencion === filtroActivo).length; }
function renderLegend(){
  const el = document.getElementById("fmcn-legend");
  if (!el) return;
  let rows;
  if (colorMode === "donante"){
    rows = CAT_ORDER.map(c => '<div class="lg-row"><span class="lg-dot" style="background:' + DONANTE_CAT[c].color + ';"></span>' + (DONANTE_CAT[c][lang] || c) + ' (' + DONANTE_CAT[c].n + ')</div>').join("");
  } else {
    rows = TIPOS.map(tt => '<div class="lg-row"><span class="lg-dot" style="background:' + tt.color + ';"></span>' + t(tt.key) + '</div>').join("");
  }
  const extra = (escalaMode === "inversion") ? '<div class="lg-row"><span class="lg-dot hollow"></span>' + t("lg_no_monto") + '</div>' : "";
  el.innerHTML = '<div class="lg-title">' + t(colorMode === "donante" ? "lg_donante" : "lg_tipo") + '</div>' + rows + extra +
    '<div class="lg-count">' + visiblesCount() + ' / 16 ' + t("lg_programas") + '</div>';
}

/* ===== Init ===== */
renderFiltros();
renderStats();
wireToolbar();
renderToolbarEstado();
renderLegend();
renderPanelBienvenida();
</script>
