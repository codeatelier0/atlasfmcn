<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Atlas FMCN — Case Study · Miguel Angel Salamanca</title>
<meta name="description" content="Case study: especificación funcional y diseño del Atlas FMCN — mapa interactivo de impacto de financiamiento del Fondo Mexicano para la Conservación de la Naturaleza. Trabajo de Product Owner: historias de usuario, modelo de datos, criterios de aceptación, stack, roadmap y prompts de diseño." />
<meta property="og:title" content="Atlas FMCN — Case Study · Miguel Angel Salamanca" />
<meta property="og:description" content="Documento viviente de especificación funcional + prototipo del mapa interactivo de impacto del FMCN, co-creado con IA." />
<meta property="og:type" content="article" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* ============ tokens — idénticos a asalamanca.work ============ */
  :root{
    --bg:#0e1014;
    --bg-2:#14171d;
    --panel:#181c23;
    --panel-2:#1d222b;
    --line:rgba(255,255,255,0.07);
    --line-strong:rgba(255,255,255,0.14);
    --text:#eef1f6;
    --muted:#8b94a3;
    --faint:#565f6e;
    --accent:#4d8dff;
    --accent-dim:#2a6fdb;
    --accent-glow:rgba(77,141,255,0.30);
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --sans:"Space Grotesk",system-ui,sans-serif;
    --docside:292px;
    --maxw:880px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--bg);}
  a{color:inherit;}
  .mono{font-family:var(--mono);}
  .kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px 2px var(--accent-glow);flex:none;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line-strong);border-radius:6px;padding:5px 9px;letter-spacing:.02em;}
  .btn{font-family:var(--mono);font-size:14px;color:var(--bg);background:var(--accent);border-radius:9px;padding:14px 24px;text-decoration:none;font-weight:500;transition:.25s;}
  .btn:hover{box-shadow:0 8px 28px -8px var(--accent-glow);transform:translateY(-2px);}
  .ghost{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:4px;transition:.2s;}
  .ghost:hover{color:var(--accent);border-color:var(--accent);}
  .grid-bg{
    position:absolute;inset:0;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:62px 62px;
    -webkit-mask-image:radial-gradient(ellipse 90% 75% at 40% 35%,#000 20%,transparent 90%);
            mask-image:radial-gradient(ellipse 90% 75% at 40% 35%,#000 20%,transparent 90%);
    pointer-events:none;
  }
  .sec-head{margin-bottom:54px;max-width:640px;}
  .sec-no{display:block;font-size:13px;color:var(--accent);letter-spacing:.1em;margin-bottom:18px;font-family:var(--mono);}
  .sec-title{font-weight:700;font-size:clamp(34px,4.5vw,54px);line-height:1;letter-spacing:-.03em;margin:0;}
  .sec-intro{font-size:19px;color:var(--muted);margin:22px 0 0;text-wrap:pretty;}
  .lang-toggle{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;display:inline-flex;background:none;cursor:pointer;padding:0;width:fit-content;}
  .lang-toggle span{padding:7px 12px;color:var(--muted);transition:.2s;}
  .lang-toggle span.on{background:var(--accent);color:var(--bg);font-weight:700;}
  .brand{display:flex;align-items:center;gap:13px;text-decoration:none;}
  .mark{width:42px;height:42px;border:1px solid var(--line-strong);border-radius:10px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--accent);transition:.25s;flex:none;}
  .brand:hover .mark{border-color:var(--accent);box-shadow:0 0 18px -4px var(--accent-glow);}
  .brand-name{font-size:11px;line-height:1.55;color:var(--muted);letter-spacing:.04em;}
  .navlink{font-size:14px;letter-spacing:.01em;color:var(--muted);text-decoration:none;transition:.2s;width:fit-content;position:relative;}
  .navlink:hover{color:var(--text);}
  .navlink.active{color:var(--accent);}
  .side-foot{display:flex;flex-direction:column;gap:20px;}
  .side-copy{font-size:11px;color:var(--faint);line-height:1.8;}
  .exp-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .exp-card{background:var(--bg);padding:34px 30px;transition:.3s;position:relative;}
  .exp-card:hover{background:var(--panel);}
  .exp-no{font-size:13px;color:var(--accent);margin-bottom:26px;font-family:var(--mono);}
  .exp-card h3{font-size:23px;margin:0 0 12px;letter-spacing:-.01em;}
  .exp-card p{font-size:15.5px;color:var(--muted);margin:0;}
  .work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .work-card{border:1px solid var(--line);border-radius:14px;padding:28px;text-decoration:none;display:flex;flex-direction:column;transition:.28s;background:var(--bg);}
  .work-card:hover{background:var(--panel);border-color:var(--line-strong);transform:translateY(-3px);}
  .work-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .work-cat{font-size:11px;color:var(--accent);letter-spacing:.04em;}
  .work-arrow{color:var(--muted);transition:.25s;}
  .work-card:hover .work-arrow{color:var(--accent);transform:translate(2px,-2px);}
  .work-card h4{font-size:24px;margin:0 0 6px;letter-spacing:-.01em;}
  .work-card p{font-size:15px;color:var(--muted);margin:0 0 18px;flex:1;}
  .work-cta{font-size:12.5px;color:var(--faint);}
  .work-card:hover .work-cta{color:var(--accent);}
  .col-head{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 22px;font-family:var(--mono);}
  .hello{display:flex;align-items:center;gap:13px;margin-bottom:28px;}
  .hero-cta{margin-top:42px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;}

  /* ============ breadcrumbs ============ */
  .crumbs{font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .crumbs a{color:var(--muted);text-decoration:none;transition:.2s;}
  .crumbs a:hover{color:var(--accent);}
  .crumb-sep{color:var(--faint);opacity:.6;}
  .crumb-here{color:var(--accent);}

  /* ============ cover ============ */
  .cover-top{display:flex;justify-content:space-between;align-items:center;padding:30px clamp(28px,6vw,90px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,16,20,0.85);backdrop-filter:blur(8px);z-index:40;}
  .cover-hero{position:relative;padding:110px clamp(28px,6vw,90px) 70px;overflow:hidden;}
  .cover-hero-inner{position:relative;z-index:2;max-width:780px;}
  .cover-title{font-weight:700;font-size:clamp(52px,8vw,100px);line-height:.95;letter-spacing:-.04em;margin:0;}
  .cover-sub{font-size:clamp(14px,1.5vw,17px);color:var(--accent);margin:22px 0 0;letter-spacing:.01em;}
  .cover-blurb{font-size:clamp(17px,1.9vw,21px);color:var(--muted);margin:22px 0 0;max-width:640px;text-wrap:pretty;}
  .meta-strip{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:70px 0 0;max-width:980px;}
  .meta-strip > div{background:var(--bg-2);padding:18px 22px;margin:0;}
  .meta-strip dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:7px;}
  .meta-strip dd{margin:0;font-size:13.5px;color:var(--text);line-height:1.45;}
  .cover-sec{padding:90px clamp(28px,6vw,90px);max-width:1160px;}
  .cover-foot{display:flex;justify-content:space-between;align-items:center;padding:34px clamp(28px,6vw,90px);border-top:1px solid var(--line);font-size:12px;color:var(--faint);flex-wrap:wrap;gap:12px;}
  .cover-foot a{color:var(--muted);text-decoration:none;transition:.2s;}
  .cover-foot a:hover{color:var(--accent);}

  /* demo frame */
  .demo-frame{border:1px solid var(--line-strong);border-radius:14px;overflow:hidden;background:#0b0d11;}
  .dp-bar{display:flex;align-items:center;gap:6px;padding:11px 13px;border-bottom:1px solid var(--line);}
  .dp-bar i{width:8px;height:8px;border-radius:50%;background:#2a2f38;}
  .dp-bar span{margin-left:8px;font-size:10.5px;color:var(--faint);}
  .demo-open{margin-left:auto;font-size:11px;color:var(--muted);text-decoration:none;transition:.2s;}
  .demo-open:hover{color:var(--accent);}
  .demo-iframe{display:block;width:100%;height:640px;border:none;background:#F9FAFB;}
  .demo-extra{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);}
  .demo-extra-label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .demo-extra-intro{font-size:14px;color:var(--muted);margin:0 0 14px;max-width:640px;}
  .demo-extra-links{display:flex;flex-wrap:wrap;gap:18px;}
  .demo-extra-link{font-size:12px;color:var(--muted);text-decoration:none;transition:.2s;}
  .demo-extra-link:hover{color:var(--accent);}

  /* index list */
  .idx-group{margin-bottom:46px;}
  .idx-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
  .idx-row{display:grid;grid-template-columns:170px 220px 1fr 24px;gap:20px;align-items:baseline;padding:17px 8px;border-top:1px solid var(--line);text-decoration:none;transition:.2s;}
  .idx-list li:last-child .idx-row{border-bottom:1px solid var(--line);}
  .idx-row:hover{background:var(--panel);}
  .idx-row:hover .work-arrow{color:var(--accent);transform:translateX(3px);}
  .idx-file{font-size:11.5px;color:var(--faint);}
  .idx-title{font-size:16.5px;font-weight:600;letter-spacing:-.01em;}
  .idx-desc{font-size:13.5px;color:var(--muted);}

  /* ============ docs layout ============ */
  .docs-layout{display:block;}
  .docs-side{
    position:fixed;top:0;left:0;bottom:0;width:var(--docside);z-index:50;
    border-right:1px solid var(--line);background:rgba(14,16,20,0.85);backdrop-filter:blur(8px);
    display:flex;flex-direction:column;gap:30px;
    padding:34px 28px;overflow-y:auto;
  }
  .docs-side-top{display:flex;flex-direction:column;gap:22px;}
  .docs-back{font-size:12px;}
  .docs-toc{display:flex;flex-direction:column;gap:26px;flex:1;}
  .toc-group{display:flex;flex-direction:column;gap:11px;}
  .toc-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
  .toc-link{font-size:14px;}
  .toc-link.active::before{content:"";position:absolute;left:-28px;top:50%;width:16px;height:1px;background:var(--accent);transform:translateY(-50%);}
  .docs-main{margin-left:var(--docside);padding:46px clamp(30px,5vw,80px) 110px;max-width:calc(var(--maxw) + var(--docside));}
  .docs-head{margin-bottom:48px;}
  .doc-title{font-weight:700;font-size:clamp(36px,4.6vw,58px);line-height:1.02;letter-spacing:-.03em;margin:14px 0 0;}
  .doc-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:18px;letter-spacing:.03em;}
  .doc-dot{opacity:.5;}

  /* markdown body */
  .md-body{max-width:var(--maxw);font-size:16.5px;color:var(--text);}
  .md-body h1,.md-body h2,.md-body h3,.md-body h4{font-family:var(--sans);letter-spacing:-.02em;line-height:1.15;margin:2.2em 0 .6em;}
  .md-body h1{font-size:34px;} .md-body h2{font-size:27px;} .md-body h3{font-size:21px;} .md-body h4{font-size:17px;}
  .md-body h2{padding-bottom:12px;border-bottom:1px solid var(--line);}
  .md-body p{margin:0 0 1.1em;color:var(--text);}
  .md-body p,.md-body li{text-wrap:pretty;}
  .md-body a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:.2s;}
  .md-body a:hover{border-color:var(--accent);}
  .md-body strong{color:var(--text);}
  .md-body em{color:var(--muted);}
  .md-body ul,.md-body ol{margin:0 0 1.2em;padding-left:24px;display:flex;flex-direction:column;gap:7px;}
  .md-body blockquote{margin:1.6em 0;padding:14px 22px;border-left:2px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;color:var(--muted);}
  .md-body blockquote p{margin:0;color:var(--muted);}
  .md-body code{font-family:var(--mono);font-size:.85em;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:#a8c7ff;}
  .md-body pre{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;overflow-x:auto;margin:1.5em 0;}
  .md-body pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.7;color:var(--text);}
  .md-body hr{border:none;border-top:1px solid var(--line);margin:2.5em 0;}
  .md-body table{width:100%;border-collapse:collapse;margin:1.6em 0;font-size:14px;}
  .md-body th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-strong);}
  .md-body td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:top;}
  .md-body tr:hover td{background:rgba(255,255,255,0.018);}
  .md-body img{max-width:100%;border-radius:12px;border:1px solid var(--line);}

  /* copy buttons */
  .copy-btn{
    position:absolute;top:10px;right:10px;
    font-size:11px;background:var(--bg);border:1px solid var(--line-strong);color:var(--muted);
    border-radius:7px;padding:6px 12px;cursor:pointer;transition:.2s;
  }
  .copy-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* prompt pages */
  .prompt-note{max-width:var(--maxw);font-size:15px;color:var(--muted);margin:0 0 26px;border-left:2px solid var(--accent);padding-left:18px;}
  .prompt-block{position:relative;max-width:var(--maxw);}
  .prompt-pre{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:54px 26px 26px;margin:0;overflow-x:auto;
    font-size:13px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word;
  }
  .copy-all{top:12px;right:12px;}

  /* pager */
  .doc-pager{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:var(--maxw);margin-top:80px;padding-top:34px;border-top:1px solid var(--line);}
  .pager-card{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:20px 22px;text-decoration:none;transition:.25s;background:var(--bg);}
  .pager-card:hover{background:var(--panel);border-color:var(--line-strong);}
  .pager-next{text-align:right;align-items:flex-end;}
  .pager-dir{font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;}
  .pager-card:hover .pager-dir{color:var(--accent);}
  .pager-title{font-size:17px;font-weight:600;letter-spacing:-.01em;}

  /* ============ responsive ============ */
  @media(max-width:980px){
    .exp-cards{grid-template-columns:1fr;}
    .work-grid{grid-template-columns:1fr;}
    .meta-strip{grid-template-columns:repeat(2,1fr);}
    .idx-row{grid-template-columns:1fr 24px;gap:6px 16px;}
    .idx-file{order:3;grid-column:1 / -1;}
    .idx-desc{grid-column:1 / -1;}
    .docs-side{position:static;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line);flex-direction:column;}
    .docs-toc{flex-direction:row;flex-wrap:wrap;gap:22px;}
    .toc-link.active::before{display:none;}
    .docs-main{margin-left:0;padding:40px 24px 90px;}
    .doc-pager{grid-template-columns:1fr;}
    .pager-next{text-align:left;align-items:flex-start;}
    .demo-iframe{height:520px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="atlas-data.jsx"></script>
<script type="text/babel" src="atlas-content.jsx"></script>
<script type="text/babel" src="atlas-components.jsx"></script>
<script type="text/babel" src="atlas-app.jsx"></script>

<style id="__om-edit-overrides"></style>
</body>
</html>
